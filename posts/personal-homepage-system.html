          <p class="article-summary">
            一个长期维护的主页，应该像内容和作品的入口，而不只是静态介绍。
          </p>
        </header>

        <div class="article-content">
          <h2>它应该解释你正在做什么</h2>
          <p>
            名片只说明身份，主页可以说明方向。访问者应该能快速知道你关注什么、做过什么、接下来想探索什么。
          </p>

          <h2>它也应该帮助你整理自己</h2>
          <p>
            当主页被持续更新，它会变成一个外化的思考系统。文章、项目、笔记和链接，会慢慢形成自己的脉络。
          </p>

          <blockquote>
            主页不是一次性工程，而是你和世界保持连接的一块工作台。
          </blockquote>
